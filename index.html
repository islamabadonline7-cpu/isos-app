<!DOCTYPE html>
<html lang="ur" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <link rel="stylesheet" href="style.css">
    <title>ISOS COCO AI</title>
</head>
<body>
    <script src="isos-menu.js"></script>
    <iframe id="web-frame" src="https://isos.onlinehubs.world/"></iframe>

    <div id="coco-btn-container" style="position: fixed; bottom: 20px; left: 20px; z-index: 999999;" onclick="handleCOCO()">
        <img src="logo.png" style="width: 75px; height: 75px; border-radius: 50%; border: 3px solid #FFD700; box-shadow: 0 4px 15px rgba(0,0,0,0.5);" alt="COCO">
        <div style="color: #FFD700; font-size: 11px; font-weight: bold; text-align: center; margin-top: 5px; text-shadow: 1px 1px 2px #000;">COCO LIVE</div>
    </div>

    <script src="isos-brain.js"></script>
    <script>
        function handleCOCO() {
            if (window.speechSynthesis.paused) window.speechSynthesis.resume();
            if (typeof welcomePublic === "function") welcomePublic();
        }
    </script>
</body>
</html>
