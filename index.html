<!DOCTYPE html>
<html lang="ur" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ISOS COCO AI - Live Master</title>
    <link rel="manifest" href="manifest.json">
    <style>
        :root { --primary-blue: #001f3f; --royal-gold: #FFD700; }
        body, html { margin: 0; padding: 0; height: 100%; overflow: hidden; font-family: 'Segoe UI', Arial; background: var(--primary-blue); color: white; }
        
        #main-container { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; text-align: center; }
        .logo-circle { width: 120px; height: 120px; border-radius: 50%; border: 3px solid var(--royal-gold); box-shadow: 0 0 30px rgba(255,215,0,0.4); margin-bottom: 20px; cursor: pointer; }
        
        /* لائیو وائس لہریں */
        .wave-box { display: flex; align-items: center; height: 50px; gap: 4px; }
        .bar { width: 4px; height: 15px; background: var(--royal-gold); border-radius: 10px; transition: 0.1s; }
        .active .bar { animation: wave-anim 0.5s infinite alternate; }
        @keyframes wave-anim { from { height: 10px; } to { height: 45px; } }
        
        #status { margin-top: 15px; font-size: 18px; color: var(--royal-gold); font-weight: bold; }
    </style>
</head>
<body>

    <div id="main-container">
        <img src="logo.png" class="logo-circle" id="coco-btn" onclick="toggleCOCO()">
        <div class="wave-box" id="wave-container">
            <div class="bar"></div><div class="bar"></div><div class="bar"></div><div class="bar"></div><div class="bar"></div>
        </div>
        <p id="status">شہزاد صاحب، بات کرنے کے لیے لوگو پر کلک کریں</p>
    </div>

    <script src="isos-brain.js"></script>
    <script>
        let isActive = false;
        function toggleCOCO() {
            const status = document.getElementById('status');
            const wave = document.getElementById('wave-container');
            
            if (!isActive) {
                isActive = true;
                status.innerText = "میں سن رہی ہوں...";
                wave.classList.add('active');
                if(typeof startLiveListening === "function") startLiveListening();
            } else {
                isActive = false;
                status.innerText = "سسٹم آف ہے";
                wave.classList.remove('active');
                window.speechSynthesis.cancel();
            }
        }
    </script>
</body>
</html>
