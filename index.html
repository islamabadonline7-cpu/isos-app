<!DOCTYPE html>
<html lang="ur" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ISOS COCO Master App</title>
    <style>
        /* موبائل سکرین کو مکمل فٹ کرنے کے لیے */
        body, html { margin: 0; padding: 0; height: 100%; width: 100%; overflow: hidden; background: #000; }
        #web-frame { width: 100%; height: 100vh; border: none; display: block; }

        /* کوکو بٹن کی پوزیشن */
        #coco-btn-container {
            position: fixed; bottom: 20px; left: 20px;
            z-index: 999999; cursor: pointer; text-align: center;
        }
        .logo-btn {
            width: 70px; height: 70px; border-radius: 50%;
            border: 3px solid #FFD700; background: #001f3f;
        }
        #status-txt { color: #FFD700; font-size: 11px; font-weight: bold; margin-top: 5px; }
    </style>
</head>
<body>
    <script src="isos-menu.js"></script>
    <iframe id="web-frame" src="https://isos.onlinehubs.world/"></iframe>

    <div id="coco-btn-container" onclick="toggleCOCO()">
        <img src="logo.png" class="logo-btn" onerror="this.src='https://via.placeholder.com/70/001f3f/FFD700?text=ISOS'">
        <div id="status-txt">COCO LIVE</div>
    </div>

    <script src="isos-brain.js"></script>
    <script>
        let isActive = false;
        function toggleCOCO() {
            const status = document.getElementById('status-txt');
            // آڈیو کانٹیکسٹ کو موبائل پر بیدار کرنا
            if (window.speechSynthesis.paused) window.speechSynthesis.resume();
            
            if (!isActive) {
                isActive = true;
                status.innerText = "میں سن رہی ہوں...";
                status.style.color = "#00FF00";
                if(typeof startLiveListening === "function") startLiveListening();
            } else {
                isActive = false;
                status.innerText = "COCO LIVE";
                status.style.color = "#FFD700";
                window.speechSynthesis.cancel();
            }
        }
    </script>
</body>
</html>
