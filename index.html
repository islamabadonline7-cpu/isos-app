<!DOCTYPE html>
<html lang="ur" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#001f3f">
    
    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="style.css">
    
    <title>ISOS COCO AI Master</title>
</head>
<body>
    <iframe id="web-frame" src="https://isos.onlinehubs.world/"></iframe>

    <div id="coco-btn-container" onclick="handleInteraction()">
        <img src="logo.png" class="logo-btn" alt="COCO" onerror="this.src='https://via.placeholder.com/75/001f3f/FFD700?text=ISOS'">
        <div id="status-txt">COCO LIVE</div>
    </div>

    <script src="isos-brain.js"></script>
    <script>
        // سروس ورکر کی رجسٹریشن (ایپ انسٹال کرنے کے لیے)
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js')
                .then(reg => console.log("ISOS App: Engine Ready", reg))
                .catch(err => console.log("System Error:", err));
            });
        }

        let isActive = false;
        
        function handleInteraction() {
            if (window.speechSynthesis.paused) {
                window.speechSynthesis.resume();
            }
            toggleCOCO();
        }

        function toggleCOCO() {
            const status = document.getElementById('status-txt');
            if (!isActive) {
                isActive = true;
                status.innerText = "میں سن رہی ہوں...";
                status.style.color = "#00FF00";
                
                if(typeof welcomePublic === "function") welcomePublic();
                if(typeof startListening === "function") startListening();
            } else {
                isActive = false;
                status.innerText = "COCO LIVE";
                status.style.color = "#FFD700";
                window.speechSynthesis.cancel();
            }
        }
    </script>
</body>
</html>
