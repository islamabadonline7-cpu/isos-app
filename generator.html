<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ISOS Enterprise Generator V22</title>
<style>
body{font-family:Arial,sans-serif;max-width:1200px;margin:auto;padding:20px;background:#f5f7fb}
.card{background:#fff;padding:20px;border-radius:12px;box-shadow:0 2px 10px rgba(0,0,0,.1)}
input,button,textarea{width:100%;padding:12px;margin:8px 0}
button{background:#0A58CA;color:#fff;border:none;cursor:pointer}
#output{margin-top:20px;white-space:pre-wrap}
</style>
</head>
<body>
<div class="card">
<h1>ISOS Enterprise Generator V22</h1>
<input id="title" placeholder="Enter Article Title">
<button onclick="generateArticle()">Generate Full Article</button>
<textarea id="seo" rows="4" placeholder="SEO output"></textarea>
<div id="output">Ready...</div>
</div>
<script>
async function generateArticle(){
 const title=document.getElementById('title').value.trim();
 if(!title){alert('Enter title');return;}
 document.getElementById('output').innerHTML='Generating...';
 const seoTitle=title+' | Islamabad Online Services';
 const seoDesc='Complete guide about '+title;
 document.getElementById('seo').value=seoTitle+'\n'+seoDesc;
 try{
   const r=await fetch('https://isos-gemini-api.onlinehubsworld.workers.dev/',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({title:title})
   });
   const data=await r.json();
   document.getElementById('output').innerText=data.article || JSON.stringify(data);
 }catch(e){
   document.getElementById('output').innerText='Error: '+e.message;
 }
}
</script>
</body>
</html>
