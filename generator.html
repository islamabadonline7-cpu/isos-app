<!DOCTYPE html>
<html lang="ur-PK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ISOS AI Page Generator Tool — Premium Core</title>
    <style>
        :root { --primary: #0a58ca; --secondary: #ffd700; --dark: #0f172a; --card: #1e293b; --text: #f8fafc; }
        body { font-family: 'Segoe UI', Arial, sans-serif; background-color: var(--dark); color: var(--text); margin: 0; padding: 20px; direction: rtl; }
        .container { max-width: 1200px; margin: 0 auto; background: #131c2e; padding: 30px; border-radius: 16px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); border: 1px solid rgba(255,255,255,0.05); }
        h1 { text-align: center; color: #22c55e; font-size: 28px; margin-bottom: 5px; }
        .subtitle { text-align: center; color: #94a3b8; font-size: 14px; margin-bottom: 30px; direction: ltr; }
        .input-group { display: flex; gap: 10px; margin-bottom: 25px; direction: ltr; }
        input[type="text"] { flex: 1; padding: 15px; border-radius: 8px; border: 1px solid #334155; background: var(--dark); color: white; font-size: 16px; text-align: left; }
        button { background: #22c55e; color: white; border: none; padding: 15px 30px; border-radius: 8px; font-size: 16px; font-weight: 700; cursor: pointer; transition: all 0.3s ease; }
        button:hover { background: #15803d; transform: translateY(-2px); }
        .output-area { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-top: 20px; }
        .box { background: var(--dark); border-radius: 8px; padding: 20px; border: 1px solid #334155; height: 650px; overflow-y: auto; text-align: right; }
        .box.code-box { direction: ltr; text-align: left; }
        h3 { margin-top: 0; color: #22c55e; border-bottom: 1px solid #334155; padding-bottom: 10px; display: flex; justify-content: space-between; align-items: center; font-size: 18px; }
        textarea { width: 100%; height: 570px; background: transparent; color: #a7f3d0; border: none; resize: none; font-family: 'Courier New', Courier, monospace; font-size: 13px; outline: none; direction: ltr; text-align: left; }
        .preview-content { color: #cbd5e1; font-size: 14px; line-height: 1.6; direction: rtl; text-align: right; background: #ffffff; padding: 20px; border-radius: 8px; color: #333; }
        .copy-btn { background: #334155; color: white; padding: 5px 10px; font-size: 12px; border-radius: 4px; border: none; cursor: pointer; }
        .copy-btn:hover { background: var(--primary); }
        @media (max-width: 768px) { .output-area { grid-template-columns: 1fr; } }
    </style>
</head>
<body>

<div class="container">
    <h1>🚀 ائی ایس او ایس (ISOS) اے آئی پریمیم پیج جینیریٹر</h1>
    <div class="subtitle">Islamabad Online Services ® — Premium Global Automation Infrastructure</div>
    
    <div class="input-group">
        <input type="text" id="pageTitle" placeholder="Enter English Title (e.g., Saudi Embassy Attestation Service)">
        <input type="text" id="pageUrduTitle" placeholder="اردو متبادل ٹائٹل لکھیں (مثلاً: سعودی ایمبیسی اٹیسٹیشن سروس)">
        <button onclick="generateIsosPage()">پریمیم پیج کوڈ بنائیں</button>
    </div>

    <div class="output-area">
        <div class="box code-box">
            <h3>📋 بلاگر ایچ ٹی ایم ایل کوڈ (HTML Output) <button class="copy-btn" onclick="copyIsosCode()">کوڈ کاپی کریں</button></h3>
            <textarea id="htmlOutput" readonly placeholder="آپ کا پریمیم بلاگر کوڈ تمام فیچرز اور سوشل میڈیا کے ساتھ یہاں مینوئلی ڈسپلے ہوگا..."></textarea>
        </div>
        
        <div class="box">
            <h3>👁️ لائیو ڈیزائن پریویو (Live Preview)</h3>
            <div id="previewOutput" class="preview-content">آپ کے تیار شدہ پیج کا لائیو ڈیزائن ڈھانچہ یہاں نظر آئے گا۔</div>
        </div>
    </div>
</div>

<script>

        '    <h2 style="color: #d32f2f; border-right: 8px solid #0a58ca; padding-right: 15px; margin-top: 30px;">1.1 تعارف اور سروس کی اہمیت</h2>\n' +

        '    <p style="line-height: 2; font-size: 16px;"><strong>1.1.2</strong> اس سروس کا بنیادی مقصد آپ کو سرکاری دفاتر اور ایمبیسیوں کی طویل لائنوں اور پیچیدہ دستاویزاتی کارروائیوں سے بچانا ہے۔ ہم آپ کے دستاویزات کو قانونی قواعد کے مطابق ویریفائی کروا کر بحفاظت پروسیس کرتے.</p>\n\n' +
        '    <h2 style="color: #d32f2f; border-right: 8px solid #0a58ca; padding-right: 15px; margin-top: 30px;">1.2 لازمی دستاویزات کی فہرست</h2>\n' +
        '    <ul style="line-height: 2.2; font-size: 16px; list-style-type: square; padding-right: 20px;">\n' +
        '        <li><strong>1.2.1</strong> اصل شناختی کارڈ (CNIC) یا نائکوپ کی کاپی۔</li>\n' +
        '        <li><strong>1.2.2</strong> اصل دستاویزات (HEC، موفا، یا متعلقہ بورڈ سے تصدیق شدہ)۔</li>\n' +
        '        <li><strong>1.2.3</strong> پاسپورٹ کے فرنٹ پیج کی واضح فوٹو کاپی۔</li>\n' +
        '        <li><strong>1.2.4</strong> اتھارٹی لیٹر (اگر پروسیس کے لیے محکمے کو مطلوب ہو)۔</li>\n' +
        '    </ul>\n\n' +
        '    <h2 style="color: #d32f2f; border-right: 8px solid #0a58ca; padding-right: 15px; margin-top: 30px;">1.3 پروسیسنگ ٹائم فریم اور تفصیلات</h2>\n' +
        '    <table style="width: 100%; border-collapse: collapse; margin: 20px 0; font-size: 16px; text-align: center;">\n' +
        '        <thead>\n' +
        '            <tr style="background-color: #0a58ca; color: white;">\n' +
        '                <th style="padding: 12px; border: 1px solid #eee;">سروس کا نام</th>\n' +
        '                <th style="padding: 12px; border: 1px solid #eee;">مقام</th>\n' +
        '                <th style="padding: 12px; border: 1px solid #eee;">تخمینہ وقت</th>\n' +
        '                <th style="padding: 12px; border: 1px solid #eee;">اسٹیٹس</th>\n' +
        '            </tr>\n' +
        '        </thead>\n' +
        '        <tbody>\n' +
        '            <tr>\n' +
        '                <td style="padding: 12px; border: 1px solid #eee;">' + cleanTitleUrdu + '</td>\n' +
        '                <td style="padding: 12px; border: 1px solid #eee;">اسلام آباد مراد مرکز</td>\n' +
        '                <td style="padding: 12px; border: 1px solid #eee;">3 سے 7 ورکنگ ڈیز</td>\n' +
        '                <td style="padding: 12px; border: 1px solid #eee; color: green; font-weight: bold;">فعال (Active)</td>\n' +
        '            </tr>\n' +
        '        </tbody>\n' +
        '    </table>\n\n' +
        '    <h2 style="color: #d32f2f; border-right: 8px solid #0a58ca; padding-right: 15px; margin-top: 40px;">1.4 فوری رابطہ فارم (Call To Action)</h2>\n' +
        '    <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 15px; margin-top: 20px; text-align: center;">\n' +
        '        <div style="background: #fffcfc; padding: 15px; border-radius: 8px; border: 1px solid #eee;">\n' +
        '            <p style="margin:0; font-weight:bold; color:#25d366;">واٹس ایپ سپورٹ</p>\n' +
        '            <a href="https://wa.me/923044841012" target="_blank" style="text-decoration:none; color:#333; font-weight:bold;">0304 4841012</a>\n' +
        '        </div>\n' +
        '        <div style="background: #fffcfc; padding: 15px; border-radius: 8px; border: 1px solid #eee;">\n' +
        '            <p style="margin:0; font-weight:bold; color:#0a58ca;">فون کال کریں</p>\n' +
        '            <a href="tel:03044841012" style="text-decoration:none; color:#333; font-weight:bold;">0304 4841012</a>\n' +
        '        </div>\n' +
        '        <div style="background: #fffcfc; padding: 15px; border-radius: 8px; border: 1px solid #eee;">\n' +
        '            <p style="margin:0; font-weight:bold; color:#d32f2f;">ای میل کریں</p>\n' +
        '            <a href="mailto:islamabadonline7@gmail.com" style="text-decoration:none; color:#333; font-weight:bold;">islamabadonline7@gmail.com</a>\n' +
        '        </div>\n' +
        '    </div>\n\n' +
        '    <h2 style="color: #0a58ca; text-align: center; margin-top: 40px; font-size: 18px;">ہمارے تمام آفیشل سوشل نیٹ ورکس سے جڑیں</h2>\n' +
        '    <div style="display: flex; justify-content: center; gap: 15px; margin-top: 15px; flex-wrap: wrap;">\n' +
        '        <a href="https://youtube.com/@IslamabadOnlineServices" target="_blank" style="text-decoration:none; font-weight:bold; color:#ff0000;">YouTube</a> |\n' +
        '        <a href="https://tiktok.com/@isbonlineltd" target="_blank" style="text-decoration:none; font-weight:bold; color:#000;">TikTok</a> |\n' +
        '        <a href="https://instagram.com/islamabadonlineofficials" target="_blank" style="text-decoration:none; font-weight:bold; color:#e1306c;">Instagram</a> |\n' +
        '        <a href="https://linkedin.com/in/islamabad-online" target="_blank" style="text-decoration:none; font-weight:bold; color:#0077b5;">LinkedIn</a>\n' +
        '    </div>\n\n' +
        '    <p style="text-align: center; margin-top: 40px; font-size: 12px; color: #666;">© 2026 اسلام آباد آن لائن سروسز (ISOS) - تمام حقوق محفوظ ہیں۔ ®</p>\n' +
        '</div>';

    document.getElementById('htmlOutput').value = htmlCode;
    document.getElementById('previewOutput').innerHTML = htmlCode;
}

function copyIsosCode() {
    var copyText = document.getElementById("htmlOutput");
    if(copyText.value === "") { alert("پہلے ٹائٹل لکھ کر پیج کوڈ بنائیں شاہزاد بھائی!"); return; }
    copyText.select();
    copyText.setSelectionRange(0, 99999);
    document.execCommand("copy");
    alert("📋 کوڈ کامیابی سے کاپی ہو گیا ہے! اب آپ اسے بلاگر پیج میں پیسٹ کر سکتے ہیں۔");
}
</script>

</body>
</html>
