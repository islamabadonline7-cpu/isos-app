# SL-ID: ISOS-SYNC-137.1
name: ISOS Master Auto-Sync

on:
  schedule:
    - cron: '*/30 * * * *' 
  workflow_dispatch: 

jobs:
  drive_sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write # یہ لائن سب سے اہم ہے
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }} # خودکار ٹوکن کا استعمال

      - name: Sync from Google Drive
        uses: jm-duarte/google-drive-sync-action@v1.0.1
        with:
          sk_file: ${{ secrets.GDRIVE_CREDENTIALS }}
          folder_id: '1Rl8h0nWh8MwCpOfRcxXibnJC7-sU1al1'
          destination: .
          
      - name: Commit and Push Changes
        run: |
          git config --global user.name "ISOS-COCO-BOT"
          git config --global user.email "isos@onlineservices.com"
          git add .
          git commit -m "Auto-sync from Google Drive: $(date)" || echo "No changes to commit"
          git push origin main
