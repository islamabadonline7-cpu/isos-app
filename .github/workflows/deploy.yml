name: ISOS Super App Deployment

on:

  push:

    branches:

      - main

  workflow_dispatch:

permissions:

  contents: read

  pages: write

  id-token: write

concurrency:

  group: "pages"

  cancel-in-progress: true

jobs:

  build:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout Repository

        uses: actions/checkout@v4

      - name: Verify Project Structure

        run: |

          echo "Checking ISOS Files..."

          ls -la

          test -f index.html

          test -f generator.html

          test -f style.css

          test -f isos-brain.js

          test -f isos-menu.js

          test -f manifest.json

          test -f sw.js

          test -f template.html

      - name: Upload Pages Artifact

        uses: actions/upload-pages-artifact@v3

        with:

          path: .

  deploy:

    environment:

      name: github-pages

      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest

    needs: build

    steps:

      - name: Deploy to GitHub Pages

        id: deployment

        uses: actions/deploy-pages@v4
