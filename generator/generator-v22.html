<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ISOS AI Content Studio</title>
<style>
body{margin:0;font-family:Arial,sans-serif;background:#f5f7fb}
header{background:#0a58ca;color:#fff;padding:20px;text-align:center}
.container{padding:20px;max-width:1400px;margin:auto}
.card{background:#fff;border-radius:12px;padding:20px;margin-bottom:15px;box-shadow:0 2px 8px rgba(0,0,0,.08)}
input,textarea,button{width:100%;padding:12px;margin-top:8px;box-sizing:border-box}
button{background:#0a58ca;color:#fff;border:none;cursor:pointer}
.tabs{display:flex;gap:10px;flex-wrap:wrap;margin:15px 0}
.tab{padding:10px 15px;background:#e9ecef;border-radius:8px}
.output{min-height:300px;white-space:pre-wrap}
.urdu{font-family:'Noto Nastaliq Urdu','Jameel Noori Nastaleeq',serif;direction:rtl;text-align:right}
footer{text-align:center;padding:20px;color:#666}
</style>
</head>
<body>
<header>
<h1>ISOS AI Content Studio</h1>
<p>Islamabad Online Services</p>
</header>
<div class="container">
<div class="card">
<label>Article Title</label>
<input id="title" placeholder="Germany Work Visa 2026">
<label>Additional Instructions</label>
<textarea id="notes" rows="4"></textarea>
<button onclick="generateContent()">Generate Complete Content Package</button>
</div>
<div class="card">
<div class="tabs">
<div class="tab">Article</div><div class="tab">SEO</div><div class="tab">FAQ</div>
<div class="tab">Social</div><div class="tab">Images</div><div class="tab">Export</div>
</div>
<div id="output" class="output urdu">ISOS AI Content Studio Ready...</div>
</div>
</div>
<footer>
Islamabad Online Services ®<br>
WhatsApp: +92 304 484 1012<br>
Email: islamabadonline7@gmail.com
</footer>
<script>
const API_URL="https://isos-gemini-v22.onlinehubsworld.workers.dev/";
async function generateContent(){
 const title=document.getElementById('title').value.trim();
 if(!title){alert('Enter article title');return;}
 document.getElementById('output').innerText='Generating...';
 try{
   const r=await fetch(API_URL,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({title})});
   const data=await r.json();
   document.getElementById('output').innerText=data.article||JSON.stringify(data,null,2);
 }catch(e){document.getElementById('output').innerText='Error: '+e.message;}
}
</script>
</body>
</html>
